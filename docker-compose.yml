services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gianan
      POSTGRES_PASSWORD: gianan
      POSTGRES_DB: gianan
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gianan -d gianan"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gianan:gianan@db:5432/gianan
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://rm7g66d.abc-tunnel.us/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-cx/gpt-6-luna}
      MODEL_PERSONA: ${MODEL_PERSONA:-cx/gpt-6-luna}
      MODEL_ANALYST: ${MODEL_ANALYST:-ag/gemini-3.8-flash-low}
      MODEL_PLANNER: ${MODEL_PLANNER:-ag/gemini-3.8-flash-low}
      MODEL_GUARD: ${MODEL_GUARD:-ag/gemini-3.8-flash-low}
      MODEL_EXTRACT: ${MODEL_EXTRACT:-cx/gpt-5.6-luna}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_MODEL_PREFERRED: ${GEMINI_MODEL_PREFERRED:-}
      GEMINI_MODEL_FALLBACK: ${GEMINI_MODEL_FALLBACK:-gemini-2.5-flash}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-gemini-embedding-001}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "8091:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: ./frontend
    ports:
      - "4178:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
