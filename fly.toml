# Fly.io — app API. Web là app thứ hai, build từ frontend/Dockerfile,
# hoặc một VPS với docker compose (cách chắc để giữ URL tới 11/12/2026).
app = "gianan-api"
primary_region = "sin"

[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"

[env]
  LLM_PROVIDER = "auto"
  GEMINI_MODEL = "gemini-2.5-flash"
  GEMINI_MODEL_FALLBACK = "gemini-2.5-flash"
  GEMINI_EMBED_MODEL = "gemini-embedding-001"
  OPENAI_MODEL = "cx/gpt-6-luna"
  MODEL_PERSONA = "cx/gpt-6-luna"
  MODEL_ANALYST = "ag/gemini-3.8-flash-low"
  MODEL_PLANNER = "ag/gemini-3.8-flash-low"
  MODEL_GUARD = "ag/gemini-3.8-flash-low"
  MODEL_EXTRACT = "cx/gpt-5.6-luna"

# Đặt bí mật bằng: fly secrets set GEMINI_API_KEY=... DATABASE_URL=... ADMIN_TOKEN=...
# DATABASE_URL phải trỏ tới Postgres có extension vector (image pgvector/pgvector).
